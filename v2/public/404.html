<!doctype html>
<!--
  GitHub Pages SPA fallback: GH Pages serves this file for any unknown path.
  It re-encodes the requested path into a query string and redirects to the
  app's index.html, which restores the real path via the script in index.html.
  https://github.com/rafgraph/spa-github-pages
-->
<html>
<head>
  <meta charset="UTF-8" />
  <title>Andrew Whitely</title>
  <script>
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
