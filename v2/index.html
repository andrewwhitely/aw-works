<!doctype html>
<html lang="en" data-theme="dark">

<head>
	<!-- Google Analytics -->
	<script src="/resource/analytics.js"></script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="description" content="Andrew Whitely — Senior Software Engineer." />
	<title>Andrew Whitely</title>

	<meta property="og:type" content="website" />
	<meta property="og:title" content="Andrew Whitely" />
	<meta property="og:description" content="Senior Software Engineer" />
	<meta property="og:url" content="https://aw.works" />
	<meta property="og:image" content="https://www.aw.works/og-image.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="Andrew Whitely" />
	<meta name="twitter:description" content="Senior Software Engineer" />
	<meta name="twitter:image" content="https://www.aw.works/og-image.png" />
	<link rel="canonical" href="https://aw.works" />

	<script>
		(function () {
			var t = localStorage.getItem('theme') ||
				(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', t);
		})();
	</script>

	<!-- Restores the real path after the 404.html SPA-fallback redirect (GitHub Pages). -->
	<script>
		(function () {
			var l = window.location;
			if (l.search[1] === '/') {
				var decoded = l.search.slice(1).split('&').map(function (s) {
					return s.replace(/~and~/g, '&');
				}).join('?');
				window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
			}
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
		rel="stylesheet" />
	<link rel="icon" type="image/svg+xml" href="/logo.png" />
</head>

<body>
	<div id="root"></div>

</body>

</html>
